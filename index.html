<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>各辦事處 KPI 追蹤看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --bg-card: #ffffff;
    --bg-soft: #ebe7dd;
    --ink: #1a1f1c;
    --ink-soft: #4a544c;
    --ink-mute: #8a8d85;
    --line: #d8d2c4;
    --line-strong: #5a625b;
    --accent: #2d4a3e;
    --accent-warm: #c8731f;
    --accent-warm-soft: #f5e6d3;
    --paid: #2d4a3e;
    --paid-bg: #e3eae5;
    --unpaid: #b8541a;
    --unpaid-bg: #f7e5d4;
    --danger: #a83232;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Noto Sans TC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      radial-gradient(circle at 8% 12%, rgba(200, 115, 31, 0.04) 0%, transparent 40%),
      radial-gradient(circle at 92% 88%, rgba(45, 74, 62, 0.05) 0%, transparent 40%);
    min-height: 100vh;
  }

  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 28px 80px;
  }

  /* ===== Header ===== */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .title-block .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--ink-mute);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .title-block h1 {
    font-family: 'Fraunces', 'Noto Sans TC', serif;
    font-weight: 600;
    font-size: 38px;
    letter-spacing: -0.01em;
    line-height: 1.1;
    color: var(--ink);
  }

  .title-block h1 em {
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
  }

  .meta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
  }

  .meta .updated-time {
    color: var(--ink);
    font-weight: 600;
    margin-top: 4px;
  }

  .meta button {
    margin-top: 8px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    padding: 7px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .meta button:hover { background: var(--accent); }
  .meta button:disabled { opacity: 0.4; cursor: wait; }

  /* ===== Loading / Error ===== */
  .state {
    padding: 60px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
  }
  .state.error {
    color: var(--danger);
    background: #fdf3f3;
    border: 1px solid #f0d0d0;
    border-radius: 4px;
    font-style: normal;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    text-align: left;
    padding: 24px;
  }
  .state.error strong { display: block; margin-bottom: 8px; font-size: 15px; }
  .state.error code {
    display: block;
    background: #fff;
    padding: 8px 12px;
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    border-radius: 3px;
    word-break: break-all;
  }

  /* ===== KPI Grid ===== */
  .kpi-section {
    margin-bottom: 40px;
  }

  .section-label {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
  }
  .section-label .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.15em;
  }
  .section-label h2 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
  }
  .section-label .rule {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }

  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 20px 22px 22px;
    position: relative;
    transition: all 0.25s ease;
  }
  .kpi-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px -8px rgba(0,0,0,0.12);
  }
  .kpi-card.total {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .kpi-card.total .office-name { color: var(--bg-soft); }
  .kpi-card.total .progress-track { background: rgba(255,255,255,0.15); }
  .kpi-card.total .stat-label { color: var(--bg-soft); opacity: 0.7; }
  .kpi-card.total .divider { background: rgba(255,255,255,0.15); }

  .office-name {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .office-name .pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-warm);
  }
  .kpi-card.total .office-name .pct { color: #e6a868; }

  .progress-track {
    height: 6px;
    background: var(--bg-soft);
    border-radius: 0;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-warm) 100%);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-fill.met { background: var(--accent); }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center;
    gap: 0;
  }
  .stat {
    text-align: center;
  }
  .stat:first-child { text-align: left; }
  .stat:last-child { text-align: right; }
  .stat-num {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .stat-num.paid { color: var(--paid); }
  .kpi-card.total .stat-num.paid { color: #8fb59f; }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-mute);
    margin-top: 5px;
  }
  .divider {
    width: 1px;
    height: 24px;
    background: var(--line);
  }

  /* ===== Filter Bar ===== */
  .filter-bar {
    background: var(--bg-card);
    border: 1px solid var(--line);
    padding: 18px 22px;
    margin-bottom: 18px;
    display: flex;
    gap: 24px;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .filter-group label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--line);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .chip .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    margin-left: 6px;
    opacity: 0.7;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box:focus { border-color: var(--ink); }

  /* ===== Table ===== */
  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--line);
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  thead th {
    background: var(--ink);
    color: var(--bg);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 11px;
    letter-spacing: 0.08em;
    font-weight: 500;
    text-align: left;
    padding: 14px 18px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  thead th:first-child { width: 56px; text-align: center; }
  thead th.tax-col { font-family: 'JetBrains Mono', monospace; font-size: 10px; }

  tbody tr {
    border-bottom: 1px solid var(--line);
    transition: background 0.12s;
  }
  tbody tr:hover { background: var(--bg-soft); }
  tbody tr:last-child { border-bottom: none; }

  tbody td {
    padding: 13px 18px;
    vertical-align: middle;
  }
  tbody td.idx {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
  }
  tbody td.tax {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  tbody td.office {
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
  }
  tbody td.company {
    color: var(--ink);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 2px;
    font-family: 'Noto Sans TC', sans-serif;
    white-space: nowrap;
  }
  .badge.paid {
    background: var(--paid-bg);
    color: var(--paid);
  }
  .badge.unpaid {
    background: var(--unpaid-bg);
    color: var(--unpaid);
  }
  .badge::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .empty-row td {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-mute);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
  }

  /* ===== Footer ===== */
  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* ===== Animations ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .kpi-card { animation: fadeUp 0.5s ease backwards; }
  .kpi-card:nth-child(1) { animation-delay: 0.05s; }
  .kpi-card:nth-child(2) { animation-delay: 0.1s; }
  .kpi-card:nth-child(3) { animation-delay: 0.15s; }
  .kpi-card:nth-child(4) { animation-delay: 0.2s; }
  .kpi-card:nth-child(5) { animation-delay: 0.25s; }
  .kpi-card:nth-child(6) { animation-delay: 0.3s; }

  /* ===== Mobile ===== */
  @media (max-width: 700px) {
    .wrap { padding: 20px 16px 60px; }
    .title-block h1 { font-size: 26px; }
    header { align-items: flex-start; }
    .meta { text-align: left; }
    .filter-bar { gap: 14px; padding: 14px; }
    .filter-group { width: 100%; flex-direction: column; align-items: flex-start; }
    .search-box { width: 100%; }
    thead th, tbody td { padding: 10px 12px; font-size: 12px; }
    tbody td.tax { font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <div class="eyebrow">TAITRA · 各辦事處進度追蹤</div>
      <h1>企業進出口數據看板<br><em>年度KPI追蹤</em></h1>
    </div>
    <div class="meta">
      <div>LAST SYNC</div>
      <div class="updated-time" id="updatedTime">—</div>
      <button id="refreshBtn">重新同步</button>
    </div>
  </header>

  <div id="content">
    <div class="state" id="loadingState">資料載入中...</div>
  </div>

</div>

<script>
  // ======================================================
  // ⚙️ 設定區（部署時請修改這兩個值）
  // ======================================================
  const CONFIG = {
    SHEET_ID: '1D-WydXycsPcPeJ1gU2NEyeyBRyD6iWdJc6NVsDRPgBg',
    API_KEY: 'AIzaSyDpyDIwy0LRDNVbnh0sKTghnAPm_VR7XQs',
    SHEET_NAME: '工作表1',
    RANGE: 'A1:J100'
  };
  // ======================================================

  let allRows = [];   // 廠商名單
  let kpiData = [];   // KPI 統計
  let filters = { office: 'ALL', status: 'ALL', search: '' };

  const $ = (id) => document.getElementById(id);

  // ---------- 載入 Google Sheet ----------
  async function loadData() {
    const btn = $('refreshBtn');
    if (btn) { btn.disabled = true; btn.textContent = '同步中...'; }

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SHEET_ID}/values/${encodeURIComponent(CONFIG.SHEET_NAME)}!${CONFIG.RANGE}?key=${CONFIG.API_KEY}`;

    try {
      const res = await fetch(url);
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      parseSheet(data.values || []);
      render();
      updateTime();
    } catch (err) {
      showError(err.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '重新同步'; }
    }
  }

  // ---------- 解析 Sheet 資料 ----------
  // 左側 A-D：辦事處, 統一編號, 廠商名稱, 繳費狀態
  // 右側 F-J：辦事處, 總報名件數, 已繳費, 年度KPI, 年度達標率
  function parseSheet(values) {
    allRows = [];
    kpiData = [];

    // 跳過第一列標題，從 index 1 開始
    for (let i = 1; i < values.length; i++) {
      const row = values[i];

      // 左側廠商名單（A-D欄）
      if (row[0] && row[1] && row[2]) {
        allRows.push({
          office: String(row[0]).trim(),
          taxId: String(row[1]).trim(),
          company: String(row[2]).trim(),
          status: String(row[3] || '').trim()
        });
      }

      // 右側 KPI（F-J 欄 = index 5-9）
      if (row[5] && row[6] !== undefined) {
        kpiData.push({
          office: String(row[5]).trim(),
          registered: parseInt(row[6]) || 0,
          paid: parseInt(row[7]) || 0,
          kpi: parseInt(row[8]) || 0,
          rate: String(row[9] || '').trim()
        });
      }
    }
  }

  // ---------- 渲染整個畫面 ----------
  function render() {
    const content = $('content');
    content.innerHTML = '';

    // KPI 卡片區
    const kpiSection = document.createElement('section');
    kpiSection.className = 'kpi-section';
    kpiSection.innerHTML = `
      <div class="section-label">
        <span class="num">01</span>
        <h2>辦事處 KPI 達標進度</h2>
        <span class="rule"></span>
      </div>
      <div class="kpi-grid" id="kpiGrid"></div>
    `;
    content.appendChild(kpiSection);

    const grid = kpiSection.querySelector('#kpiGrid');
    kpiData.forEach(k => {
      const pctNum = k.kpi > 0 ? Math.round((k.paid / k.kpi) * 100) : 0;
      const isTotal = k.office.includes('總計') || k.office === '合計';
      const met = pctNum >= 100;

      const card = document.createElement('div');
      card.className = 'kpi-card' + (isTotal ? ' total' : '');
      card.innerHTML = `
        <div class="office-name">
          <span>${escapeHtml(k.office)}</span>
          <span class="pct">${pctNum}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill ${met ? 'met' : ''}" style="width: ${Math.min(pctNum, 100)}%"></div>
        </div>
        <div class="stats-row">
          <div class="stat">
            <div class="stat-num">${k.registered}</div>
            <div class="stat-label">報名</div>
          </div>
          <div class="divider"></div>
          <div class="stat">
            <div class="stat-num paid">${k.paid}</div>
            <div class="stat-label">已繳費</div>
          </div>
          <div class="divider"></div>
          <div class="stat">
            <div class="stat-num">${k.kpi}</div>
            <div class="stat-label">目標</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    // 廠商名單區
    const listSection = document.createElement('section');
    listSection.innerHTML = `
      <div class="section-label">
        <span class="num">02</span>
        <h2>廠商繳費明細</h2>
        <span class="rule"></span>
      </div>
      <div class="filter-bar" id="filterBar"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>辦事處</th>
              <th class="tax-col">統一編號</th>
              <th>廠商名稱</th>
              <th>繳費狀態</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    `;
    content.appendChild(listSection);

    renderFilters();
    renderTable();

    // Footer
    const footer = document.createElement('footer');
    const total = allRows.length;
    const paidCount = allRows.filter(r => r.status === '已繳費').length;
    footer.innerHTML = `
      <span>共 ${total} 筆 · 已繳費 ${paidCount} · 待繳費 ${total - paidCount}</span>
      <span>SOURCE: GOOGLE SHEETS · AUTO-SYNC</span>
    `;
    content.appendChild(footer);
  }

  // ---------- 篩選器 ----------
  function renderFilters() {
    const bar = $('filterBar');
    const offices = [...new Set(allRows.map(r => r.office))].sort();

    bar.innerHTML = `
      <div class="filter-group">
        <label>辦事處</label>
        <div class="chip-row" id="officeChips">
          <button class="chip ${filters.office === 'ALL' ? 'active' : ''}" data-office="ALL">
            全部<span class="count">${allRows.length}</span>
          </button>
          ${offices.map(o => {
            const count = allRows.filter(r => r.office === o).length;
            return `<button class="chip ${filters.office === o ? 'active' : ''}" data-office="${escapeAttr(o)}">
              ${escapeHtml(o)}<span class="count">${count}</span>
            </button>`;
          }).join('')}
        </div>
      </div>
      <div class="filter-group">
        <label>狀態</label>
        <div class="chip-row" id="statusChips">
          <button class="chip ${filters.status === 'ALL' ? 'active' : ''}" data-status="ALL">全部</button>
          <button class="chip ${filters.status === '已繳費' ? 'active' : ''}" data-status="已繳費">已繳費</button>
          <button class="chip ${filters.status === '待繳費' ? 'active' : ''}" data-status="待繳費">待繳費</button>
        </div>
      </div>
      <input type="text" class="search-box" id="searchBox" placeholder="搜尋廠商名稱或統編..." value="${escapeAttr(filters.search)}">
    `;

    bar.querySelectorAll('[data-office]').forEach(b => {
      b.onclick = () => { filters.office = b.dataset.office; renderFilters(); renderTable(); };
    });
    bar.querySelectorAll('[data-status]').forEach(b => {
      b.onclick = () => { filters.status = b.dataset.status; renderFilters(); renderTable(); };
    });
    const searchBox = $('searchBox');
    searchBox.oninput = (e) => { filters.search = e.target.value; renderTable(); };
    searchBox.focus();
    // 重新 focus 回到原本位置
    const len = searchBox.value.length;
    searchBox.setSelectionRange(len, len);
  }

  // ---------- 表格 ----------
  function renderTable() {
    const tbody = $('tableBody');
    const kw = filters.search.trim().toLowerCase();

    const rows = allRows.filter(r => {
      if (filters.office !== 'ALL' && r.office !== filters.office) return false;
      if (filters.status !== 'ALL' && r.status !== filters.status) return false;
      if (kw && !r.company.toLowerCase().includes(kw) && !r.taxId.includes(kw)) return false;
      return true;
    });

    if (rows.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="5">查無符合條件的廠商</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((r, i) => {
      const isPaid = r.status === '已繳費';
      return `
        <tr>
          <td class="idx">${String(i + 1).padStart(2, '0')}</td>
          <td class="office">${escapeHtml(r.office)}</td>
          <td class="tax">${escapeHtml(r.taxId)}</td>
          <td class="company">${escapeHtml(r.company)}</td>
          <td><span class="badge ${isPaid ? 'paid' : 'unpaid'}">${escapeHtml(r.status || '—')}</span></td>
        </tr>
      `;
    }).join('');
  }

  // ---------- 工具 ----------
  function updateTime() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    $('updatedTime').textContent =
      `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }

  function showError(msg) {
    $('content').innerHTML = `
      <div class="state error">
        <strong>⚠ 無法載入 Google Sheet 資料</strong>
        錯誤訊息：${escapeHtml(msg)}<br><br>
        <strong>請確認以下事項：</strong>
        1. 已將 <code>CONFIG.API_KEY</code> 填入有效的 Google API key<br>
        2. Google Sheet 已設定為「知道連結的任何人皆可檢視」<br>
        3. Google Sheets API 已在 Google Cloud Console 啟用<br>
        4. 工作表名稱 <code>${escapeHtml(CONFIG.SHEET_NAME)}</code> 正確無誤
      </div>
    `;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  // ---------- 初始化 ----------
  $('refreshBtn').onclick = loadData;
  loadData();

  // 每 5 分鐘自動同步一次
  setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
